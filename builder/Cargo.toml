[package]
name = "derive_builder"
version = "0.0.0"
autotests = false
edition = "2021"
publish = false

[lib]
proc-macro = true

[[test]]
name = "tests"
path = "tests/progress.rs"

[dev-dependencies]
trybuild = { version = "1.0.108", features = ["diff"] }

[dependencies]
quote = { version = "1.0" }
syn = { git = "https://github.com/dtolnay/syn", features = ["full"] }
proc-macro2 = { version = "1.0" }
